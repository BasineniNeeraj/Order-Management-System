spring.application.name=order-management-project

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/OMSProjectdb
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:your_db_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Razorpay Credentials
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:your_razorpay_secret}

# Jackson Settings
spring.jackson.mapper.accept-case-insensitive-enums=true